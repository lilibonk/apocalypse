version: "3.9"

# 本地开发环境：PostgreSQL 18.6 + Redis 8.10.1
# 用法：docker compose up -d

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: apocalypse-postgres
    environment:
      POSTGRES_DB: apocalypse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 仅供当前本地设备使用，不向局域网接口发布。
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ 使用主版本专属数据子目录，卷需挂载到父目录以支持原地升级。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apocalypse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    container_name: apocalypse-redis
    command: redis-server --appendonly yes
    ports:
      # 仅供当前本地设备使用，不向局域网接口发布。
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
