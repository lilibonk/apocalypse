user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # Omit query strings, request/response bodies and authorization headers.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    client_max_body_size 24m;
    # Keep security headers when a location adds its own cache policy (nginx 1.30).
    add_header_inherit merge;
    map $http_host $public_https_port {
        default 443;
        ~:(?<explicit_https_port>[0-9]+)$ $explicit_https_port;
    }
    # Docker's DNS tracks backend recreation without a stale resolved address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream application_backend {
        zone application_backend 64k;
        server backend:8080 resolve;
    }

    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /ready { return 200 'ready\n'; }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        root /usr/share/nginx/html;
        index index.html;

        # Only the safe summary is available through the public origin.
        location = /api/actuator/health {
            proxy_pass http://application_backend/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection close;
            proxy_set_header Host $host;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $public_https_port;
            proxy_set_header X-Forwarded-Prefix '';
            proxy_set_header X-Forwarded-Ssl '';
        }
        location /api/actuator { return 404; }
        # Disabling springdoc does not remove bundled WebJar static resources.
        # Reserve these production gateway namespaces regardless of authentication.
        location ~ "^/api/(?:swagger-ui(?:[.]html)?(?:[/;]|$)|webjars(?:[/;]|$)|v3/api-docs(?:[.]yaml)?(?:[/;]|$))" {
            return 404;
        }
        location = /api { return 404; }
        location /api/ {
            proxy_pass http://application_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection close;
            proxy_set_header Host $host;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $public_https_port;
            proxy_set_header X-Forwarded-Prefix '';
            proxy_set_header X-Forwarded-Ssl '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control 'public, immutable';
        }
        location = /index.html {
            add_header Cache-Control 'no-store';
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control 'no-store';
        }
    }
}
