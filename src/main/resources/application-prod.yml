# 生产环境：所有连接与密钥只读环境变量、无默认密码；
# 未配置对应环境变量时启动即失败，属预期行为。
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 5s

# 生产关闭 OpenAPI 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: info

apocalypse:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      # 生产为同源部署/经网关转发，不放行任何跨域来源（空列表）
      allowed-origins: []
