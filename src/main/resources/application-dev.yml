# 本地开发环境（默认 profile）：连接指向 docker-compose up -d 启动的本地容器
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/apocalypse
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # 连接池上限：本地开发 10 足够，生产按 DB max_connections 折算
      maximum-pool-size: 10
      minimum-idle: 2
      # 连接最大存活 30 分钟，小于 PG 默认 wait_timeout，避免拿到失效连接
      max-lifetime: 1800000
      connection-timeout: 10000
      idle-timeout: 600000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s

# springdoc 默认开启（api-docs / swagger-ui），无需额外配置

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    io.apocalypse: debug

apocalypse:
  security:
    jwt:
      # 默认密钥仅本地开发使用，生产必须通过环境变量 JWT_SECRET 注入（HS256 需 ≥ 32 字节）
      secret: ${JWT_SECRET:apocalypse-local-dev-secret-key-0123456789abcdef}
    cors:
      # 本地前端 Vite 开发服务器（5173 端口）
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
    # 服务账号（2 期外部 Agent 接入；demo-client 仅为本地示例，生产走环境变量）
    clients:
      - client-id: demo-client
        client-secret: ${DEMO_CLIENT_SECRET:demo-client-secret-change-me}
        scopes: [read, write]
