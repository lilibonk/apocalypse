# 环境无关配置。环境相关项见 application-{dev,test,prod}.yml。
# 默认激活 dev，可用 SPRING_PROFILES_ACTIVE 环境变量覆盖。
spring:
  application:
    name: apocalypse
    # OpenAPI 文档版本号（OpenApiConfig 读取）
    version: 0.0.1-SNAPSHOT
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Flyway 各环境均执行迁移；locations 默认 classpath:db/migration，显式写出便于阅读
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # event_publication 由 Flyway 管理；框架自动 DDL 禁止在业务迁移前抢跑
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 逻辑删除全局配置：1=已删除，0=正常（实体字段见 common BaseEntity）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# springdoc 基础路径；各 profile 可关闭（如 prod）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # 输出 traceId（TraceIdFilter 写入 MDC）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"

apocalypse:
  security:
    jwt:
      issuer: apocalypse
      audience: apocalypse-api
      ttl-minutes: 120
      # refresh token 有效期（天），默认 7 天
      refresh-ttl-days: 7
    cors:
      # 环境无关默认：不放行任何跨域来源，各环境按需在 application-{env}.yml 覆盖
      allowed-origins: []
  cache:
    l1:
      max-size: 10000
      expire-seconds: 300
    l2:
      expire-seconds: 1800
    ttl-jitter-ratio: 0.2
    allow-null-values: true
  events:
    completed-retention-days: 7
    cleanup-cron: "0 15 3 * * *"
  audit:
    retention-days: 180
    cleanup-cron: "0 30 3 * * *"
