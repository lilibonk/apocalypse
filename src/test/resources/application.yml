# 集成测试配置（Testcontainers 场景）。
# 注意：Maven 测试 classpath 中本文件优先于 src/main/resources/application.yml（同名遮蔽），
# 因此主配置的公共项需在此保留一份；环境连接由 @ServiceConnection 接管（见 AbstractIntegrationTest）。
spring:
  application:
    name: apocalypse
    version: 0.0.1-SNAPSHOT
  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # event_publication 由 Flyway 管理
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

apocalypse:
  security:
    jwt:
      issuer: apocalypse
      audience: apocalypse-api
      ttl-minutes: 120
      # refresh token 有效期（天），默认 7 天
      refresh-ttl-days: 7
    cors:
      # 默认不放行跨域；dev profile（application-dev.yml）会覆盖为本地 5173 来源
      allowed-origins: []
  cache:
    l1:
      max-size: 10000
      expire-seconds: 300
    l2:
      expire-seconds: 1800
    ttl-jitter-ratio: 0.2
    allow-null-values: true
  events:
    completed-retention-days: 7
    cleanup-cron: "0 15 3 * * *"
  audit:
    retention-days: 180
    cleanup-cron: "0 30 3 * * *"
  ratelimit:
    # 放大登录/刷新限流窗口：多个 IT 类共享同一 Redis 容器与同一来源 IP，默认 20/30 每分钟会互相干扰。
    # RateLimitIT 用独立上下文覆盖为 2/min 验证限流本身。
    limits:
      login: 1000
      refresh: 1000
